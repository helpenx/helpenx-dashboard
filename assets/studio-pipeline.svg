    <rect x="40" y="112" width="104" height="5" rx="2.5" fill="#0e1c2e" opacity="0.14"/>
    <rect x="40" y="130" width="60" height="5" rx="2.5" fill="#0e1c2e" opacity="0.10"/>
    <rect x="40" y="142" width="82" height="5" rx="2.5" fill="#0e1c2e" opacity="0.10"/>
