    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a7494" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6d4bf0" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
