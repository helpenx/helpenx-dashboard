    <path d="M628 168l7-5v10z" fill="#96650a" opacity="0.7"/>
    <circle cx="668" cy="216" r="12" fill="#96650a" opacity="0.12" stroke="#96650a" stroke-opacity="0.45"/>
    <path d="M663 216l3 4 6-8" fill="none" stroke="#96650a" stroke-width="1.8" stroke-linecap="round"/>

