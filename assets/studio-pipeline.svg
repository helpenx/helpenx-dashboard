<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img" aria-labelledby="t d">
  <title id="t">HelpEnx Studio 短剧 AI 生产链路示意</title>
  <desc id="d">从剧本、分镜、角色 / 场景 / 模型等数字资产，到关键帧、视频片段与配音剪辑时间线的流程示意图。</desc>
  <defs>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a7494"/>
      <stop offset="100%" stop-color="#6d4bf0"/>
