    </filter>
  </defs>

  <rect width="680" height="460" fill="#f6f8fb"/>
  <rect width="680" height="460" fill="url(#grid)"/>
  <ellipse cx="340" cy="70" rx="300" ry="120" fill="url(#glow)"/>

  <g font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#5c6b7f" letter-spacing="0.06em">
