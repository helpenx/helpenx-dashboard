<header class="site-header">

    <span class="brand__sub">工作台</span>

  <div class="hsearch" id="search-box" role="search">

    <input id="search" class="hsearch__input" type="search" placeholder="搜索服务、能力或域名…"

      <div class="suggest__list" id="suggest-list" role="listbox" aria-label="搜索结果"></div>

      <span>GitHub</span>
    </a>
    <span class="header__stat" id="header-stat"></span>
  </div>
</header>

<main>
  <section class="hero">
    <h1 class="hero__title">所有服务，<span class="grad">一处直达</span></h1>
    <p class="hero__sub" id="hero-tagline"></p>

    <div class="hero__cta">
      <a class="btn btn-primary" id="cta-primary" href="#" target="_blank" rel="noopener">进入 Studio</a>
      <a class="btn btn-ghost" href="#board">查看全部服务</a>
    </div>

    <nav class="chips" id="chips" aria-label="分类筛选"></nav>
  </section>

  <section class="showcase" id="showcase" aria-label="重点产品"></section>

  <section class="board" id="board" aria-live="polite">
    <h2 class="board__title" id="board-title">更多服务</h2>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p>没有匹配的服务</p>
      <p class="empty__sub">换个关键词，或回到「全部」</p>
      <button class="empty__reset" id="empty-reset" type="button">清空搜索与筛选</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span>© <span id="year"></span> HelpEnx</span>
  <span class="site-footer__site">helpenx.com</span>
</footer>
